{% extends "layout.html" %}{% block title %}Editar BOM{% endblock %}
{% block content %}
<h3>Editar receta (BOM)</h3>
<form method="post" class="mb-3">
  <div class="mb-3">
    <label class="form-label">Producto final</label>
    <input class="form-control" name="producto" required placeholder="Ej: Alfajor MP 30 g">
  </div>

  <div id="rows">
    <div class="row g-2 align-items-end mb-2">
      <div class="col-md-6">
        <label class="form-label">ÃƒÂtem</label>
        <select class="form-select" name="item_id_1">
          {% for it in items %}<option value="{{ it.id }}">{{ it.nombre }} ({{ it.unidad }})</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Cantidad</label>
        <input class="form-control" type="number" step="0.01" name="cantidad_1" value="0">
      </div>
      <div class="col-md-3">
        <label class="form-label">Unidad</label>
        <input class="form-control" name="unidad_1" placeholder="g/ml/un">
      </div>
    </div>
  </div>

  <button type="button" class="btn btn-outline-secondary btn-sm" onclick="addRow()">Agregar fila</button>
  <button class="btn btn-primary">Guardar BOM</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('bom_list') }}">Cancelar</a>
</form>

<script>
let idx = 1;
function addRow(){
  idx++;
  const html = `
  <div class="row g-2 align-items-end mb-2">
    <div class="col-md-6">
      <label class="form-label">ÃƒÂtem</label>
      <select class="form-select" name="item_id_${idx}">
        {% for it in items %}<option value="{{ it.id }}">{{ it.nombre }} ({{ it.unidad }})</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Cantidad</label>
      <input class="form-control" type="number" step="0.01" name="cantidad_${idx}" value="0">
    </div>
    <div class="col-md-3">
      <label class="form-label">Unidad</label>
      <input class="form-control" name="unidad_${idx}" placeholder="g/ml/un">
    </div>
  </div>`;
  document.getElementById('rows').insertAdjacentHTML('beforeend', html);
}
</script>
{% endblock %}
