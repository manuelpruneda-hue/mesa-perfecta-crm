{% extends "layout.html" %}{% block title %}Nuevo usuario{% endblock %}
{% block content %}
<h3>Nuevo usuario</h3>
<form method="post" class="row g-3">
  <div class="col-md-4">
    <label class="form-label">Usuario</label>
    <input class="form-control" name="username" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Rol</label>
    <select class="form-select" name="role" required>
      <option value="admin">admin</option>
      <option value="admin_limited">admin_limited</option>
      <option value="contador">contador</option>
      <option value="operador">operador</option>
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">ContraseÃƒÂ±a inicial</label>
    <input class="form-control" name="password" required>
  </div>
  <div class="col-12">
    <button class="btn btn-primary">Guardar</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('usuarios_list') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
