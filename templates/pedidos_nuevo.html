{% extends "layout.html" %}{% block title %}Nuevo pedido{% endblock %}
{% block content %}
<h3>Nuevo pedido</h3>
<form method="post" class="row g-3">
  <div class="col-md-3">
    <label class="form-label">Tipo</label>
    <select class="form-select" name="tipo" required>
      <option value="catering">catering</option>
      <option value="snack">snack</option>
      <option value="otros">otros</option>
    </select>
  </div>
  <div class="col-md-5">
    <label class="form-label">Cliente</label>
    <select class="form-select" name="cliente_id">
      <option value="">Ã¢â‚¬â€</option>
      {% for c in clientes %}<option value="{{ c.id }}">{{ c.nombre }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-md-2">
    <label class="form-label">Fecha</label>
    <input class="form-control" type="date" name="fecha_evento" required>
  </div>
  <div class="col-md-2">
    <label class="form-label">Hora</label>
    <input class="form-control" type="time" name="hora_evento" required>
  </div>
  <div class="col-md-6">
    <label class="form-label">Lugar</label>
    <input class="form-control" name="lugar">
  </div>
  <div class="col-md-3">
    <label class="form-label">Costo estimado</label>
    <input class="form-control" type="number" step="0.01" name="costo_estimado" value="0">
  </div>
  <div class="col-md-3">
    <label class="form-label">Precio venta</label>
    <input class="form-control" type="number" step="0.01" name="precio_venta" value="0">
  </div>
  <div class="col-12">
    <label class="form-label">Observaciones</label>
    <textarea class="form-control" name="observaciones" rows="3"></textarea>
  </div>
  <div class="col-12">
    <button class="btn btn-primary">Guardar</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('pedidos') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
